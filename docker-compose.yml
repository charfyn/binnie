services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: binnie
      POSTGRES_USER: binnie
      POSTGRES_PASSWORD: binnie
    ports:
      - "5432:5432"
    volumes:
      - binnie_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binnie -d binnie"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  binnie_postgres:
